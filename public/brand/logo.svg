<?xml version="1.0" encoding="UTF-8"?>
<!--
  logo.svg — lockup del NOMBRE DEL JUEGO (revisado 2026-09-14, cumplimiento
  Official Rules del Axie Vibeathon 2026): la version anterior deletreaba
  "AXIE INFINITY" grande arriba, calcando la composicion de dos niveles de
  la sub-marca oficial de Sky Mavis (mismo lockup que "Axie Infinity
  Homeland"/"Axie Infinity Classic"). La Seccion 6 de las Official Rules
  reserva "Axie names... marks" a Sky Mavis, y el RIGHTS.md del propio kit
  oficial que usa este proyecto dice explicitamente que las marcas "are not
  licensed except as needed to identify an approved Axie project" -deletrear
  el nombre completo del producto de Sky Mavis como si fuera nuestro propio
  lockup de marca va mas alla de "identificar" el proyecto. La identificacion
  como proyecto del Vibeathon ya vive aparte, en `.cover-credit`
  (CoverScreen.jsx: "Prototipo para el Axie Vibeathon 2026, Ronda 1."), asi
  que no hace falta repetirla aqui.
  El logo pasa a ser solo el nombre del juego, "TACTIC DICE", en dos lineas
  -mismas letras <path> ya dibujadas a mano (ver ch-* mas abajo, reutilizadas
  tal cual de la version anterior, solo reposicionadas/reescaladas), mismo
  tratamiento visual (contorno grueso, relleno a cuadros, zarcillos
  decorativos). Sigue autocontenido: sin <image>, sin fuentes externas.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 460 220"
  width="460"
  height="220"
  role="img"
  aria-labelledby="logoTitle"
>
  <title id="logoTitle">Tactic Dice</title>

  <defs>
    <!-- Letras: esqueleto monolinea en una caja local de 0-100 de alto
         (0 arriba, 100 abajo). Se instancian dos veces por palabra (contorno
         grueso + relleno a cuadros mas fino) via <use>. -->
    <path id="ch-A" d="M6,100 L37,0 L68,100 M18,62 L56,62" />
    <path id="ch-C" d="M45.7,89.9 L26,92.8 L9.4,77.2 L3,50 L9.4,22.8 L26,7.2 L45.7,10.1" />
    <path id="ch-D" d="M8,5 L8,95 M8,5 L31,11 L47.8,27.5 L54,50 L47.8,72.5 L31,89 L8,95" />
    <path id="ch-E" d="M10,4 L10,96 M10,4 L52,4 M10,50 L44,50 M10,96 L52,96" />
    <path id="ch-I" d="M15,4 L15,96 M5,4 L25,4 M5,96 L25,96" />
    <path id="ch-T" d="M6,4 L50,4 M28,4 L28,96" />

    <!-- Zarcillo decorativo, mismo trazado que VineIcon (LineIcons.jsx) para
         que la marca y la UI compartan el mismo doodle -reutilizado dos
         veces (normal y espejado) via <use color="..."> + currentColor. -->
    <g id="vine-shape">
      <path d="M4 21c3-1 4-6 3-10-1-4 2-7 6-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M8.5 9.4c2 .8 2.2 3.6 5 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="13" cy="3.4" r="1.5" fill="currentColor" />
      <circle cx="6.6" cy="12.2" r="1.2" fill="currentColor" />
    </g>

    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#fff8e4" />
      <rect width="10" height="10" fill="#bfead2" />
      <rect x="10" y="10" width="10" height="10" fill="#bfead2" />
    </pattern>

    <style>
      .wd-shadow use { fill: none; stroke: #0e2d22; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
      .wd-outline use { fill: none; stroke: #123a2b; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
      .wd-fill use { fill: none; stroke: url(#checker); stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Zarcillos flanqueando el titulo -->
  <use xlink:href="#vine-shape" color="#ffb0cf" transform="translate(46,4) rotate(-12) scale(1.8)" />
  <use xlink:href="#vine-shape" color="#6fcf9a" transform="translate(414,8) scale(-1.8,1.8)" />

  <!-- TACTIC (grande, con relieve escalonado). -->
  <g transform="translate(73,10) scale(0.9)">
    <g class="wd-shadow" transform="translate(0,7)">
      <use xlink:href="#ch-T" />
      <use xlink:href="#ch-A" x="62" />
      <use xlink:href="#ch-C" x="142" />
      <use xlink:href="#ch-T" x="204" />
      <use xlink:href="#ch-I" x="266" />
      <use xlink:href="#ch-C" x="304" />
    </g>
    <g class="wd-outline">
      <use xlink:href="#ch-T" />
      <use xlink:href="#ch-A" x="62" />
      <use xlink:href="#ch-C" x="142" />
      <use xlink:href="#ch-T" x="204" />
      <use xlink:href="#ch-I" x="266" />
      <use xlink:href="#ch-C" x="304" />
    </g>
    <g class="wd-fill">
      <use xlink:href="#ch-T" />
      <use xlink:href="#ch-A" x="62" />
      <use xlink:href="#ch-C" x="142" />
      <use xlink:href="#ch-T" x="204" />
      <use xlink:href="#ch-I" x="266" />
      <use xlink:href="#ch-C" x="304" />
    </g>
  </g>

  <!-- DICE (mas pequeña, pegada debajo de TACTIC). -->
  <g transform="translate(178,132) scale(0.46)">
    <g class="wd-outline">
      <use xlink:href="#ch-D" />
      <use xlink:href="#ch-I" x="68" />
      <use xlink:href="#ch-C" x="106" />
      <use xlink:href="#ch-E" x="168" />
    </g>
    <g class="wd-fill">
      <use xlink:href="#ch-D" />
      <use xlink:href="#ch-I" x="68" />
      <use xlink:href="#ch-C" x="106" />
      <use xlink:href="#ch-E" x="168" />
    </g>
  </g>
</svg>
