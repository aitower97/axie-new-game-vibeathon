<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Fold diagnostic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { height:100vh; display:flex; align-items:center; justify-content:center; background:#10201d; }
  .platform {
    position: relative;
    width: 300px; height: 200px;
    transform-style: preserve-3d;
    transform: perspective(1400px) rotateX(30deg);
    transform-origin: center bottom;
  }
  .top { position:absolute; inset:0; background: green; opacity: 0.85; }
  .wall { position:absolute; left:0; top:200px; width:300px; height:80px; background: red; transform-origin: top; }
</style>
</head>
<body>
  <div class="platform" id="platform">
    <div class="top" id="top"></div>
    <div class="wall" id="wall"></div>
  </div>
  <script>
    // Prueba minima: solo un top verde + una pared roja plegada. Sin grid, sin
    // celdas, sin nada mas -para aislar si el pliegue en si funciona.
    document.getElementById('wall').style.transform = 'rotateX(-90deg)'
    // Bisection paso 1: meter varias celdas dentro de top, como el tablero real.
    const top = document.getElementById('top')
    top.style.background = ''
    for (let i = 0; i < 6; i++) {
      const cell = document.createElement('div')
      cell.style.position = 'absolute'
      cell.style.left = (i * 50) + 'px'
      cell.style.top = '0'
      cell.style.width = '50px'
      cell.style.height = '200px'
      cell.style.background = i % 2 ? 'darkgreen' : 'green'
      top.appendChild(cell)
    }
  </script>
</body>
</html>
