<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagnostico de caras</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #10201d; font-family: system-ui; color: #fff; }
  .stage { perspective: 1400px; }
  .cube { position: relative; width: 160px; height: 160px; transform-style: preserve-3d; transform: rotateX(50deg) rotateY(-20deg); }
  .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4); }
  .legend { position: fixed; bottom: 20px; left: 20px; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="stage"><div class="cube" id="cube"></div></div>
  <div class="legend">
    TOP=rojo · BOTTOM=azul · FRONT=amarillo · BACK=morado · RIGHT=naranja · LEFT=cian<br>
    Si "arriba" de verdad se ve arriba, el cuadrado ROJO debe ser el que domina la vista.
  </div>
<script>
  const SIZE = 160, THICK = 80
  const faces = [
    { k: 'TOP',    t: `rotateX(-90deg) translateZ(${THICK/2}px)`, color: 'red' },
    { k: 'BOTTOM', t: `rotateX(90deg) translateZ(${THICK/2}px)`,  color: 'blue' },
    { k: 'FRONT',  t: `translateZ(${SIZE/2}px)`,                   color: 'gold' },
    { k: 'BACK',   t: `rotateY(180deg) translateZ(${SIZE/2}px)`,   color: 'purple' },
    { k: 'RIGHT',  t: `rotateY(90deg) translateZ(${SIZE/2}px)`,    color: 'orange' },
    { k: 'LEFT',   t: `rotateY(-90deg) translateZ(${SIZE/2}px)`,   color: 'cyan' },
  ]
  const cube = document.getElementById('cube')
  faces.forEach(f => {
    const d = document.createElement('div')
    d.className = 'face'
    d.style.background = f.color
    d.style.transform = f.t
    d.textContent = f.k
    cube.appendChild(d)
  })
</script>
</body>
</html>
