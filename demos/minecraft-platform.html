<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinculo de Lunacia — Plataforma estilo Minecraft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #8fc1e6 0%, #4d86bd 55%, #2a5178 100%);
    font-family: system-ui, sans-serif;
  }
  .stage { perspective: 1000px; }
  .spin {
    position: relative;
    transform-style: preserve-3d;
    animation: spin 28s linear infinite;
  }
  .bob {
    position: relative;
    transform-style: preserve-3d;
    animation: bob 5s ease-in-out infinite;
  }
  .platform {
    position: relative;
    transform-style: preserve-3d;
  }
  .cube {
    position: absolute;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    image-rendering: pixelated;
    background-size: 300% 300%;
    background-repeat: no-repeat;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
  }
  .hint {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    opacity: .85;
    letter-spacing: .02em;
  }
  @keyframes spin {
    from { transform: rotateX(58deg) rotateY(0deg); }
    to   { transform: rotateX(58deg) rotateY(360deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-26px); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="spin">
      <div class="bob">
        <div class="platform" id="platform"></div>
      </div>
    </div>
  </div>
  <div class="hint">4x4 · cesped arriba · tierra en los lados y abajo · CSS 3D puro</div>

<script>
  const GRID = 4
  const SIZE = 48 // px por cubo (48 = 16px de textura x3, nítido sin difuminar)

  // ---- Texturas procedurales estilo Minecraft (canvas -> dataURL) ----
  function makeTexture(size, pixelFn) {
    const c = document.createElement('canvas')
    c.width = c.height = size
    const ctx = c.getContext('2d')
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const [r, g, b] = pixelFn(x, y)
        ctx.fillStyle = `rgb(${r},${g},${b})`
        ctx.fillRect(x, y, 1, 1)
      }
    }
    return c.toDataURL()
  }
  const pick = (arr) => arr[(Math.random() * arr.length) | 0]
  const GRASS_COLORS = [['106','176','76'],['120','201','80'],['137','216','96'],['92','168','63']]
  const DIRT_COLORS  = [['139','90','43'],['122','74','37'],['156','107','58'],['107','63','34']]
  const SOIL_EDGE    = 'rgb(74,51,29)'

  const grassTex = makeTexture(16, () => pick(GRASS_COLORS))

  // Cara lateral: franja de cesped arriba (≈4px), luego tierra. Como en Minecraft.
  const sideTex = makeTexture(16, (x, y) => {
    if (y < 4) return pick(GRASS_COLORS)
    if (y === 4) return [74, 51, 29] // linea de raiz oscura
    return pick(DIRT_COLORS)
  })

  const dirtTex = makeTexture(16, () => pick(DIRT_COLORS))
  const bottomTex = makeTexture(16, (x, y) => {
    if (y === 0) return [74, 51, 29]
    return pick(DIRT_COLORS)
  })

  // ---- Construccion de los 16 cubos ----
  const platform = document.getElementById('platform')
  const half = (GRID - 1) / 2
  const halfSize = SIZE / 2

  const faces = [
    { k: 'front',  t: `translateZ(${halfSize}px)`,  img: sideTex },
    { k: 'back',   t: `rotateY(180deg) translateZ(${halfSize}px)`, img: sideTex },
    { k: 'right',  t: `rotateY(90deg) translateZ(${halfSize}px)`,  img: sideTex },
    { k: 'left',   t: `rotateY(-90deg) translateZ(${halfSize}px)`, img: sideTex },
    { k: 'top',    t: `rotateX(90deg) translateZ(${halfSize}px)`,  img: grassTex },
    { k: 'bottom', t: `rotateX(-90deg) translateZ(${halfSize}px)`, img: bottomTex },
  ]

  for (let c = 0; c < GRID; c++) {
    for (let r = 0; r < GRID; r++) {
      const cube = document.createElement('div')
      cube.className = 'cube'
      cube.style.width = SIZE + 'px'
      cube.style.height = SIZE + 'px'
      const x = (c - half) * SIZE
      const z = (r - half) * SIZE
      cube.style.transform = `translate3d(${x}px, 0, ${z}px)`
      for (const f of faces) {
        const face = document.createElement('div')
        face.className = 'face'
        face.style.backgroundImage = `url(${f.img})`
        face.style.transform = f.t
        cube.appendChild(face)
      }
      platform.appendChild(cube)
    }
  }
</script>
</body>
</html>
